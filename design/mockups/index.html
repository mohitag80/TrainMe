<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrainMe – Demo Mockups</title>
<link rel="stylesheet" href="trainme.css">
<style>
  .hint { position: fixed; right: 24px; bottom: 18px; z-index: 99; color: #8A94B0; font: 600 13px/1 -apple-system, sans-serif; background: rgba(255,255,255,.06); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); }
  body.capture .hint { display: none; }
</style>
</head>
<body>
<div id="root"></div>
<div class="hint">← → to navigate · <span id="pos"></span></div>
<script src="shots.js"></script>
<script>
  const shots = window.TRAINME.SHOTS;
  const params = new URLSearchParams(location.search);
  if (params.has("capture")) document.body.classList.add("capture");
  let i = Math.max(0, Math.min(shots.length - 1, parseInt(params.get("shot") || "0", 10)));
  function render() {
    const s = shots[i];
    document.getElementById("root").innerHTML = s.html(s);
    document.getElementById("pos").textContent = `${i + 1} / ${shots.length} · ${s.id}`;
    document.title = `TrainMe – ${s.id}`;
  }
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { i = Math.min(shots.length - 1, i + 1); render(); }
    if (e.key === "ArrowLeft") { i = Math.max(0, i - 1); render(); }
  });
  render();
</script>
</body>
</html>
