# CI (docs/04 §4): lint, type-check, test and build on every PR; images to GHCR on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build
      - name: Catalog seed is generated and valid
        run: python3 catalog/tools/build_phase1_catalog.py && git diff --exit-code catalog/phase1/catalog.json
      - name: Helm charts
        run: |
          helm dependency update src/deploy/charts/trainme
          helm lint src/deploy/charts/trainme -f src/deploy/charts/trainme/values-test.yaml
          helm lint src/deploy/charts/trainme-platform
      - name: Compose file
        run: cp src/deploy/compose/.env.example src/deploy/compose/.env && docker compose -f src/deploy/compose/docker-compose.yml config -q

  images:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-svc, tracker-svc, records-svc, analytics-svc, user-profile-svc, subscription-svc, notification-svc]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/deploy/docker/service.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: ghcr.io/${{ github.repository_owner }}/trainme-${{ matrix.service }}:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
