# Prepares a RHEL 9 test VM for TrainMe (docs/04 §2.3): Docker CE + Compose, k3s without Traefik
# (Kong is the ingress), Helm, kernel settings and firewall. Idempotent.
#   ansible-playbook rhel-test-vm.yml
- name: TrainMe test VM
  hosts: trainme_test
  become: true
  tasks:
    - name: Base packages
      ansible.builtin.dnf:
        name: [git, curl, tar, jq, firewalld, container-selinux, dnf-plugins-core]
        state: present

    - name: Docker CE repository
      ansible.builtin.command: dnf config-manager --add-repo https://download.docker.com/linux/rhel/docker-ce.repo
      args:
        creates: /etc/yum.repos.d/docker-ce.repo

    - name: Docker CE, Buildx and Compose plugin
      ansible.builtin.dnf:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present

    - name: Docker running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Kernel settings for Kubernetes and Redpanda
      ansible.posix.sysctl:
        name: '{{ item.name }}'
        value: '{{ item.value }}'
        sysctl_file: /etc/sysctl.d/90-trainme.conf
        reload: true
      loop:
        - { name: net.ipv4.ip_forward, value: '1' }
        - { name: fs.aio-max-nr, value: '1048576' }
        - { name: fs.inotify.max_user_instances, value: '1024' }
        - { name: vm.max_map_count, value: '262144' }

    - name: Install k3s (Traefik disabled; ServiceLB and local-path kept)
      ansible.builtin.shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_VERSION={{ k3s_version }}
        INSTALL_K3S_EXEC="server --disable traefik --write-kubeconfig-mode 600 --secrets-encryption"
        sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Helm
      ansible.builtin.shell: >
        curl -fsSL https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz | tar -xz -C /tmp &&
        install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
      args:
        creates: /usr/local/bin/helm

    - name: kubectl and KUBECONFIG for root
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        line: export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        create: true

    - name: Firewall running
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started

    - name: Open required ports
      ansible.posix.firewalld:
        port: '{{ item }}'
        permanent: true
        immediate: true
        state: enabled
      loop: '{{ firewall_ports }}'

    - name: Trust the k3s pod and service networks (flannel)
      ansible.posix.firewalld:
        source: '{{ item }}'
        zone: trusted
        permanent: true
        immediate: true
        state: enabled
      loop: [10.42.0.0/16, 10.43.0.0/16]
