{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: mailpit } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailpit }
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mailpit.image }}
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
{{- end }}
