apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-config
data:
  {{- include "platform.keycloakConfig" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  realm-trainme.json: |-
{{ .Files.Get "files/realm-trainme.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak }
      annotations:
        checksum/realm: {{ .Files.Get "files/realm-trainme.json" | sha256sum }}
        checksum/config: {{ include "platform.keycloakConfig" . | sha256sum }}
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args: ["start-dev", "--import-realm"]
          # Non-secret settings: keycloak-config (chart) then keycloak-overrides (optional, operator-managed).
          envFrom:
            - configMapRef: { name: keycloak-config }
            - configMapRef: { name: keycloak-overrides, optional: true }
          env:
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: KEYCLOAK_DB_PASSWORD } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: KEYCLOAK_ADMIN_PASSWORD } }
            - name: SERVICES_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: KEYCLOAK_SERVICES_CLIENT_SECRET } }
            - name: TEST_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: TEST_USER_PASSWORD } }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          readinessProbe:
            httpGet: { path: /auth/health/ready, port: management }
            periodSeconds: 10
          startupProbe:
            httpGet: { path: /auth/health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import }
      volumes:
        - { name: realm, configMap: { name: keycloak-realm } }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    konghq.com/strip-path: "false"
    konghq.com/preserve-host: "true"
spec:
  ingressClassName: kong
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: { service: { name: keycloak, port: { number: 8080 } } }
