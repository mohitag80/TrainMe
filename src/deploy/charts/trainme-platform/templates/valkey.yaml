apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: valkey } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey }
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          args: ["valkey-server", "--maxmemory", "{{ .Values.valkey.maxMemory }}", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: ["valkey-cli", "ping"] }, periodSeconds: 5 }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: {{- include "platform.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
