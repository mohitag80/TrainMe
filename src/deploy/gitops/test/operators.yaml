# Wave 0–1: operators and gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: gitops
  annotations: { argocd.argoproj.io/sync-wave: '0' }
spec:
  project: default
  source: { repoURL: https://cloudnative-pg.github.io/charts, chart: cloudnative-pg, targetRevision: 0.29.1 }
  destination: { server: https://kubernetes.default.svc, namespace: cnpg-system }
  syncPolicy: { automated: { selfHeal: true }, syncOptions: [CreateNamespace=true, ServerSideApply=true] }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong
  namespace: gitops
  annotations: { argocd.argoproj.io/sync-wave: '1' }
spec:
  project: default
  sources:
    - repoURL: https://charts.konghq.com
      chart: ingress
      targetRevision: 0.24.0
      helm: { valueFiles: [$values/src/deploy/k3s/kong-values.yaml] }
    - { repoURL: https://github.com/mohitag80/TrainMe.git, targetRevision: main, ref: values }
  destination: { server: https://kubernetes.default.svc, namespace: kong }
  syncPolicy: { automated: { selfHeal: true }, syncOptions: [CreateNamespace=true] }
